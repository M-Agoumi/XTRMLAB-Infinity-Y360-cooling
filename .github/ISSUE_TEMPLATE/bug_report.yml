name: Bug report
description: Something doesn't work the way it should.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please search
        [existing issues](https://github.com/M-Agoumi/XTRMLAB-Infinity-Y360-cooling/issues) first, and run
        `RUN_DOCTOR.bat` (or `AIO Screen.exe --doctor`): its report
        answers most of the questions below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see on the panel or in the app, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Close PC Monitor
        2. Run RUN_DEMO.bat
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release you downloaded, or the commit you're running from source.
      placeholder: v1.1.1
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How are you running it?
      options:
        - AIO Screen.exe (release)
        - From source (python / RUN_*.bat)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part?
      multiple: true
      options:
        - Panel shows nothing / wrong numbers
        - CPU temperature or fan RPM reading
        - Tray app / start at logon
        - Doctor / install
        - Building the exe
        - Other
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: input
    id: hardware
    attributes:
      label: Hardware
      description: Cooler model, panel USB ID if not 5131:2007, motherboard, CPU.
      placeholder: XTRMLAB Infinity Y360, 5131:2007, MSI B650, Ryzen 7 7800X3D
  - type: textarea
    id: logs
    attributes:
      label: Doctor report, logs or photos
      description: Paste the doctor output or aio_daemon.log. It's formatted as code automatically.
      render: text
